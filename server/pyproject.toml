[project]
name = "tasknest-server"
version = "0.1.0"
description = "TaskNest optional cloud backend (M2.1 skeleton: health and version only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Generated files stay under out/ (CLAUDE.md).
cache_dir = "../out/server/.pytest_cache"

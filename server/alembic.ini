[alembic]
script_location = migrations
prepend_sys_path = .
# The database URL comes only from TASKNEST_DATABASE_URL (see migrations/env.py); never put one here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
